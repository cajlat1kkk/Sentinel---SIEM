name: Native desktop packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  secrets:
    name: Repository · secrets and private files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check-secrets.py
  linux:
    needs: secrets
    name: Ubuntu · Qt / DPDK / NGFW / DEB
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build package and run C++ / UI / DPDK tests
        run: bash scripts/package-deb.sh
      - name: Verify real nftables filtering and NAT in isolated namespace
        run: bash scripts/test-firewall-container.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-ubuntu-24.04-amd64
          path: dist/deb/*.deb
          if-no-files-found: error
  windows:
    needs: secrets
    name: Windows · MSVC / Qt / tests / EXE
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build, test and package
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          ./packaging/windows/build.ps1
      - name: Verify native Windows background service
        shell: pwsh
        run: ./scripts/test-windows-service.ps1
      - name: Verify signed release manifests
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\Git\usr\bin;$env:PATH"
          python scripts/test-update.py --build build-windows
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-windows-x64-installer
          path: build-windows/sentinel-siem-*.exe
          if-no-files-found: error
