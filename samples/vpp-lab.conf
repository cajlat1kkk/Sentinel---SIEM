# Template used by scripts/test-vpp.py; do not pass this file to vpp directly.
# Each run replaces @RUNTIME@, @PREFIX@ and @CPU@ with private values.
unix {
  nodaemon
  runtime-dir @RUNTIME@
  cli-listen @RUNTIME@/cli.sock
  cli-no-pager
  log @RUNTIME@/vpp.log
  poll-sleep-usec 1000
}
cpu {
  main-core @CPU@
}
memory {
  main-heap-size 256M
  main-heap-page-size 4k
}
buffers {
  buffers-per-numa 2048
  page-size 4k
}
statseg {
  socket-name @RUNTIME@/stats.sock
  size 16M
  page-size 4k
}
socksvr {
  socket-name @RUNTIME@/api.sock
}
api-segment {
  prefix @PREFIX@
}
plugins {
  plugin default { disable }
  plugin dpdk_plugin.so { disable }
}
